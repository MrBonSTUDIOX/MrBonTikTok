<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MrBon — Choose TikTok Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#120708;--ink:#f3ece6;--mute:#a9979a;--line:#3a1b1e;--discord:#5865f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#3a0a0e 0,var(--bg) 60%) var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:44px 20px 56px}
h1{font:400 clamp(2rem,7vw,3.6rem)/1 "Archivo Black",Impact,sans-serif;margin:0 0 10px;letter-spacing:-.01em}
.sub{margin:0 0 32px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{display:block;text-decoration:none;color:inherit;background:#1a0b0d;border:2px solid var(--line);border-radius:6px;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.card img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.meta{display:block;padding:14px 16px 16px;border-top:3px solid var(--a)}
.meta b{display:block;font:400 1.15rem/1.2 "Archivo Black",sans-serif}
.meta i{font-style:normal;color:var(--mute);font-size:.92rem}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--a);box-shadow:0 10px 30px -10px var(--a);outline:none}
.card:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.discord{display:flex;align-items:center;gap:18px;margin-top:40px;padding:18px 20px;border:2px solid var(--discord);border-radius:6px;background:#161a3a;text-decoration:none;color:inherit}
.discord img{width:56px;height:auto;flex:none}
.discord b{display:block;font:400 1.2rem/1.2 "Archivo Black",sans-serif}
.discord span{color:#b9bef7;font-size:.95rem}
.discord:hover{background:#1d2250}
.discord:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}.meta{padding:10px 12px 12px}.meta b{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style></head><body><main>
